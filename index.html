<style>
  :root {
    --bg: #0a0a0a;
    --bg-elevated: #121212;
    --ink: #ffffff;
    --ink-muted: rgba(255, 255, 255, 0.68);
    --ink-faint: rgba(255, 255, 255, 0.42);
    --line: rgba(255, 255, 255, 0.12);
    --accent: #d4af37;
    --accent-soft: rgba(212, 175, 55, 0.14);
    --max-width: 680px;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body { overflow-x: hidden; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
    line-height: 1.6;
  }

  ::selection {
    background: var(--accent);
    color: #0a0a0a;
  }

  /* ---------- glitter background ---------- */
  #glitter-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
    opacity: 0.85;
  }

  /* ---------- hero ---------- */
  .hero {
    position: relative;
    height: 92vh;
    min-height: 520px;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
  }

  .hero img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 30%;
    filter: grayscale(1) contrast(1.05);
    will-change: transform;
    transform-origin: center;
  }

  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(10,10,10,1) 0%, rgba(10,10,10,0.55) 32%, rgba(10,10,10,0.05) 62%, rgba(10,10,10,0.25) 100%);
    z-index: 2;
  }

  .hero-content {
    position: relative;
    z-index: 3;
    width: 100%;
    padding: 0 24px 56px;
    text-align: center;
    will-change: transform, opacity;
  }

  .hero-kicker {
    display: inline-block;
    font-size: 0.72rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 14px;
    font-weight: 600;
  }

  .hero-content h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(2.8rem, 12vw, 4.6rem);
    margin: 0;
    letter-spacing: -0.015em;
    color: #ffffff;
    line-height: 1.02;
  }

  .hero-content p {
    margin: 12px 0 0;
    color: var(--ink-muted);
    font-size: 1.05rem;
    letter-spacing: 0.01em;
  }

  .scroll-cue {
    position: absolute;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 3;
    width: 22px;
    height: 34px;
    border: 1.5px solid var(--ink-faint);
    border-radius: 12px;
    display: flex;
    justify-content: center;
    padding-top: 6px;
  }

  .scroll-cue span {
    width: 3px;
    height: 6px;
    border-radius: 2px;
    background: var(--accent);
    animation: scrollCue 1.8s ease-in-out infinite;
  }

  @keyframes scrollCue {
    0% { transform: translateY(0); opacity: 1; }
    70% { transform: translateY(10px); opacity: 0; }
    100% { opacity: 0; }
  }

  /* ---------- layout / sections ---------- */
  main {
    position: relative;
    z-index: 2;
  }

  section {
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 88px 24px;
  }

  .section-label {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
  }

  .section-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .section-label h2 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 1.4rem;
    margin: 0;
    color: #ffffff;
    white-space: nowrap;
  }

  /* ---------- about ---------- */
  .about p {
    font-size: 1.02rem;
    line-height: 1.85;
    color: var(--ink-muted);
    margin: 0 0 20px;
  }

  .about p:last-child { margin-bottom: 0; }

  .about strong {
    color: #ffffff;
    font-weight: 600;
  }

  /* ---------- links ---------- */
  .links-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .link-card {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--bg-elevated);
    color: #ffffff;
    text-decoration: none;
    transition: border-color 0.25s ease, transform 0.25s ease, background 0.25s ease;
  }

  .link-card:hover,
  .link-card:focus-visible {
    border-color: var(--accent);
    background: var(--accent-soft);
    transform: translateY(-2px);
  }

  .link-icon {
    flex-shrink: 0;
    width: 42px;
    height: 42px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.05);
  }

  .link-icon svg {
    width: 20px;
    height: 20px;
    fill: var(--accent);
  }

  .link-text {
    flex: 1;
    min-width: 0;
  }

  .link-text .platform-name {
    display: block;
    font-size: 1.02rem;
    font-weight: 600;
  }

  .link-text .platform-category {
    display: block;
    font-size: 0.78rem;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 2px;
  }

  .link-arrow {
    flex-shrink: 0;
    color: var(--ink-faint);
    font-size: 1.1rem;
    transition: transform 0.25s ease, color 0.25s ease;
  }

  .link-card:hover .link-arrow {
    transform: translateX(3px);
    color: var(--accent);
  }

  /* ---------- footer ---------- */
  footer {
    text-align: center;
    padding: 48px 24px 64px;
    color: var(--ink-faint);
    font-size: 0.82rem;
    position: relative;
    z-index: 2;
  }

  footer .footer-name {
    font-family: 'Fraunces', serif;
    font-style: italic;
    color: var(--ink-muted);
    font-size: 0.95rem;
    margin-bottom: 6px;
  }

  @media (min-width: 560px) {
    .links-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }
</style>
</head>
