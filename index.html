<style>
  :root {
    --bg: #0a0a0a;
    --ink: #ffffff;
    --muted: #ffffff;
    --line: #3a3835;
  }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  /* ---------- glitter layer ---------- */
  #glitter-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
    opacity: 0.9;
  }
  .hero {
    position: relative;
    height: 78vh;
    min-height: 420px;
    overflow: hidden;
  }
  .hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
    filter: grayscale(1) contrast(1.05);
    display: block;
    will-change: transform;
    transform-origin: center;
  }
  .hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(10,10,10,1) 0%, rgba(10,10,10,0.15) 45%, rgba(10,10,10,0) 70%);
  }
  .hero-text {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 0 24px 32px;
    text-align: center;
    will-change: transform, opacity;
    z-index: 3;
  }
  .hero-text h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(2.6rem, 11vw, 4.2rem);
    margin: 0;
    letter-spacing: -0.01em;
    color: #ffffff;
  }
  .hero-text p {
    margin: 6px 0 0;
    color: #ffffff;
    font-size: 1rem;
    letter-spacing: 0.02em;
  }
  section {
    max-width: 600px;
    margin: 0 auto;
    padding: 72px 24px;
    position: relative;
    z-index: 2;
  }
  .about h2, .links h2 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 1.5rem;
    margin: 0 0 24px;
    color: #ffffff;
  }
  .about p {
    font-size: 1.02rem;
    line-height: 1.75;
    color: #ffffff;
    margin: 0 0 20px;
  }
  .about p:last-child { margin-bottom: 0; }
  .links-list { margin-top: 24px; }
  .links-list a {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 2px;
    border-top: 1px solid var(--line);
    color: #ffffff;
    text-decoration: none;
    font-size: 1.05rem;
  }
  .links-list a:last-child { border-bottom: 1px solid var(--line); }
  .links-list a span { color: #ffffff; opacity: 0.7; font-size: 0.85rem; }
  footer {
    text-align: center;
    padding: 40px 24px 60px;
    color: #ffffff;
    font-size: 0.85rem;
    position: relative;
    z-index: 2;
  }

  /* ---------- NackSgro Gold Glowing Border ---------- */
  .border-runner {
    position: fixed;
    z-index: 9999;
    pointer-events: none;
    white-space: nowrap;
    font-weight: bold;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    animation: goldGlow 1.8s infinite alternate ease-in-out;
  }

  .top-border {
    top: 2px;
    left: 0;
    width: 100vw;
  }

  .bottom-border {
    bottom: 2px;
    left: 0;
    width: 100vw;
  }

  .left-border {
    top: 0;
    left: 2px;
    height: 100vh;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
  }

  .right-border {
    top: 0;
    right: 2px;
    height: 100vh;
    writing-mode: vertical-rl;
  }

  .marquee-horizontal {
    display: inline-block;
    animation: marqueeH 14s linear infinite;
  }

  .marquee-vertical {
    display: inline-block;
    animation: marqueeV 14s linear infinite;
  }

  @keyframes marqueeH {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  @keyframes marqueeV {
    0% { transform: translateY(0); }
    100% { transform: translateY(-50%); }
  }

  /* แสงไฟวิบวับวูบวาบโทนสีเหลืองทอง */
  @keyframes goldGlow {
    0% {
      color: #ffd700;
      text-shadow: 0 0 3px #ffd700, 0 0 8px #ffae00, 0 0 15px #ffae00;
      opacity: 0.85;
    }
    50% {
      color: #fff2a3;
      text-shadow: 0 0 6px #ffffff, 0 0 14px #ffd700, 0 0 25px #ff8c00;
      opacity: 1;
    }
    100% {
      color: #e6b800;
      text-shadow: 0 0 2px #d4af37, 0 0 6px #d4af37, 0 0 12px #b8860b;
      opacity: 0.75;
    }
  }
</style>
